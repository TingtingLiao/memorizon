[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memorizon"
version = "0.1.0"
description = "Memorizon: Training World Models Beyond Their Context Window"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "diffusers>=0.35", "transformers>=4.57,<5", "accelerate>=1.6",
                "einops", "omegaconf", "numpy", "pillow", "tqdm", "sentencepiece"]

[tool.setuptools.packages.find]
include = ["memorizon*"]
